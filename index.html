  var h='<div class="pan"><h3>'+(EXQ.id?'Ändra prov':'Nytt prov')+'</h3><div class="sub">Du bestämmer varje fråga: välj typ och vilket tecken eller ord den gäller.</div><input type="text" placeholder="Provets namn" value="'+esc(EXQ.nm)+'" oninput="EXQ.nm=this.value" style="margin-top:8px">';
  EXQ.qs.forEach(function(s,i){
    var o=isW(s.k)?C.words.map(function(x){return[x.id,x.t+((s.k==='pic'||s.k==='pic2')&&!x.img?' (bild saknas)':'')]}):C.sel.map(function(c){return[c,c+(s.k==='hear'&&!C.aud[c]?' 🔇':'')]});
    h+='<div class="li"><b>'+(i+1)+'.</b><select data-i="'+i+'" onchange="eqK(+this.dataset.i,this.value)">'+TY.map(function(t){return'<option value="'+t[0]+'"'+(t[0]===s.k?' selected':'')+'>'+t[1]+'</option>'}).join('')+'</select><select class="g" data-i="'+i+'" onchange="EXQ.qs[+this.dataset.i].a=this.value">'+o.map(function(p){return'<option value="'+esc(p[0])+'"'+(p[0]===s.a?' selected':'')+'>'+esc(p[1])+'</option>'}).join('')+'</select><button class="sm" data-i="'+i+'" onclick="eqMv(+this.dataset.i,-1)">▲</button><button class="sm" data-i="'+i+'" onclick="eqMv(+this.dataset.i,1)">▼</button><button class="sm" data-i="'+i+'" onclick="eqDel(+this.dataset.i)">✕</button></div>'});
  h+='<div><button class="big" style="background:#4a8fe0" onclick="eqAdd()">+ Fråga</button><button class="big" onclick="eqSave()">Spara provet</button>'+(EXQ.id?'<button class="big" style="background:#bbb" onclick="EXQ={id:\'\',nm:\'\',qs:[]};draw()">Avbryt</button>':'')+'</div></div><div class="pan"><h3>Mina prov ('+(C.ex||[]).length+')</h3>';
  (C.ex||[]).forEach(function(x,i){h+='<div class="li"><b>'+esc(x.nm)+'</b><span class="sub">'+(x.qs?x.qs.length+' frågor':'gammal övning')+'</span><span style="margin-left:auto">'+(x.qs?'<button class="sm" data-i="'+i+'" onclick="eqEdit(+this.dataset.i)">✏️</button> ':'')+'<button class="sm" data-i="'+i+'" onclick="eqDelT(+this.dataset.i)">🗑</button></span></div>'});
  return h+'</div>'}
function aS(){
  return'<div class="pan"><h3>Lås</h3><label class="li" style="border:0"><input type="checkbox" '+(isOpen()?'checked':'')+' onchange="C.open=this.checked;sv();draw()"><span>Öppna alla valda tecken för barnet (inga lås)</span></label></div><div class="pan"><h3>☁️ Delas automatiskt</h3><div class="sub">Det du ändrar sparas i Firebase och syns hos alla som har länken.</div><button class="big" onclick="syncNow()">☁️ Synka upp allt nu</button><div class="sub" id="sy"></div></div><div class="pan"><h3>Barnets framsteg</h3><button class="sm" onclick="if(confirm(\'Nollställ framsteg?\')){P={done:{},prov:{},user:P.user,isAdm:P.isAdm};sp();draw()}">Nollställ framsteg</button></div>'}

/* ---- Föräldrar, användarlista, översikt ---- */
function ov(){return bk()+'<div class="pan"><h3>ፊደላት 🔊</h3><div class="rw">'+C.sel.map(function(c){return'<button class="tile g" style="--k:'+col(c)+';width:64px;height:64px;font-size:30px" data-c="'+esc(c)+'" onclick="play(C.aud[this.dataset.c])">'+esc(c)+'</button>'}).join('')+'</div></div><div class="pan"><h3>ቃላት</h3>'+C.words.map(function(w){return'<div class="li">'+(w.img?'<img class="th" src="'+w.img+'">':'')+'<span class="g" style="font-size:28px">'+esc(w.t)+'</span>'+(w.aud?'<button class="sm" onclick="play(C.words.find(function(x){return x.id===\''+w.id+'\'}).aud)">🔊</button>':'')+'</div>'}).join('')+'</div>'}
function uReg(){return'<div class="cen"><div style="font-size:54px">🦁</div><h1 class="g" style="margin:0">ንጽሓፍ ትግርኛ</h1></div><div class="pan"><h3>👋 Förälder / ወላዲ</h3><div class="sub">Skriv ditt namn och telefonnummer. Du gör det bara en gång.</div><input type="text" id="rn" placeholder="Namn / ስም" style="margin-top:10px"><input type="tel" id="rp" placeholder="Telefon / ቁጽሪ ተሌፎን" style="margin-top:8px"><div class="no" id="re"></div><button class="big" onclick="doReg()">▶</button></div><div class="cen"><button class="sm" onclick="lock()">🔒</button></div>'}
function doReg(){var n=$('rn').value.trim(),p=$('rp').value.replace(/\D/g,'');if(n.length<2||p.length<7){$('re').textContent='Skriv namn och telefonnummer';return}P.user={id:Math.random().toString(36).slice(2,10),name:n,phone:$('rp').value.trim(),t:Date.now()};ulog('Registrerade sig');V='home';draw()}
function ulog(e){P.log=P.log||[];P.log.unshift({t:Date.now(),e:e});if(P.log.length>40)P.log.length=40;sp()}
var UT=0,UL={},UNS=null,UX='';
function upush(){if(!DB||!P.user)return;clearTimeout(UT);UT=setTimeout(function(){DB.collection('gu').doc(P.user.id).set({name:P.user.name,phone:P.user.phone,created:P.user.t||0,last:Date.now(),done:P.done||{},prov:P.prov||{},st:P.st||{n:0,ok:0,tot:0},log:P.log||[]}).catch(function(e){console.error(e)})},1500)}
function ago(t){var m=Math.round((Date.now()-t)/60000);return m<1?'nu':m<60?m+' min sedan':m<1440?Math.round(m/60)+' tim sedan':Math.round(m/1440)+' dagar sedan'}
function aU(){
  if(!DB)return'<div class="pan">Ingen kontakt med Firebase.</div>';
  if(!UNS)UNS=DB.collection('gu').onSnapshot(function(q){UL={};q.forEach(function(d){UL[d.id]=d.data()});if(V==='adult'&&AT==='u')draw()},function(e){console.error(e)});
  var ids=Object.keys(UL).sort(function(a,b){return(UL[b].last||0)-(UL[a].last||0)}),h='<div class="pan"><h3>👥 Användare ('+ids.length+')</h3>';
  ids.forEach(function(id){var u=UL[id],st=u.st||{n:0,ok:0,tot:0};
    h+='<div class="li" style="display:block"><b>'+esc(u.name)+'</b> · <a href="tel:'+esc(u.phone)+'">'+esc(u.phone)+'</a><div class="sub">🕒 '+ago(u.last||0)+' · 🔤 '+Object.keys(u.done||{}).length+'/'+C.sel.length+' tecken · 📝 '+st.n+' övningar'+(st.tot?' ('+Math.round(100*st.ok/st.tot)+'% rätt)':'')+'</div><button class="sm" data-i="'+id+'" onclick="UX=UX===this.dataset.i?\'\':this.dataset.i;draw()">'+(UX===id?'Dölj':'Visa vad hen gjort')+'</button> <button class="sm" data-i="'+id+'" onclick="if(confirm(\'Ta bort?\'))DB.collection(\'gu\').doc(this.dataset.i).delete()">✕</button>'+(UX===id?'<div class="sub" style="margin-top:6px">'+(u.log||[]).map(function(x){return'• '+ago(x.t)+': '+esc(x.e)}).join('<br>')+'</div>':'')+'</div>'});
  return h+(ids.length?'':'<div class="sub">Ingen har öppnat appen än.</div>')+'</div>'}

/* ---- Start ---- */
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})}).catch(function(){});if(window.caches)caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})}).catch(function(){})}
idb('get').catch(function(){}).then(function(c){C=c||{v:0,sel:[],words:[],aud:{},ex:[]};C.rc=C.rc||{};C.ex=C.ex||[];C.words=C.words||[];C.aud=C.aud||{};C.sel=C.sel||[];draw();startSync()});
</script></body></html>
